<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 캘린더</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --text:#1f2430; --sub:#6b7280; --line:#e5e7eb;
  --accent:#4f7cff; --accent-soft:#e8eeff; --danger:#e5484d; --warn:#fff4e0; --warn-line:#f0b45a;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
button:hover{background:#f0f2f6}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#3d68e6}
button.danger{color:var(--danger);border-color:#f3c3c5}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--text);max-width:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0 8px 0 0}
#title{font-size:17px;font-weight:700;min-width:150px}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);position:relative}
.spacer{flex:1}
.search{position:relative}
#results{position:absolute;right:0;top:36px;width:300px;max-height:300px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;display:none}
#results div{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#results div:hover{background:#f5f7ff}
#results small{color:var(--sub);display:block}
.layout{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;align-items:start}
aside .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
aside h3{margin:0 0 8px;font-size:14px}
.cat-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cat-row input[type=color]{width:26px;height:26px;padding:0;border:none;background:none}
.cat-row span{flex:1}
.todo-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.todo-row .t{flex:1;word-break:break-all}
.todo-row.done .t{text-decoration:line-through;color:var(--sub)}
.todo-row small{color:var(--sub)}
.todo-row small.over{color:var(--danger)}
.todo-row .x{padding:0 6px;border:none;background:none;color:var(--sub)}
.add-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add-row input[type=text]{flex:1;min-width:90px}
.hint{color:var(--sub);font-size:12px;line-height:1.5;margin:6px 0 0}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
/* 월 보기 */
.m-head,.m-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.m-head div{padding:8px;text-align:center;font-weight:600;border-bottom:1px solid var(--line);background:#fafbfc}
.m-head div:first-child,.sun{color:var(--danger)}
.m-head div:last-child,.sat{color:var(--accent)}
.cell{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;cursor:pointer;overflow:hidden}
.cell:nth-child(7n){border-right:none}
.cell.other{background:#fafafa;opacity:.6}
.cell .n{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px;font-size:12px}
.cell.today .n{background:var(--accent);color:#fff}
.chip{display:block;font-size:12px;padding:1px 5px;margin-top:2px;border-radius:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip.todo{background:#fff!important;color:var(--text);border:1px dashed #b8bcc6}
.chip.todo.done{text-decoration:line-through;color:var(--sub)}
.more{font-size:12px;color:var(--sub);margin-top:2px;cursor:pointer}
/* 주/일 보기 */
.t-wrap{overflow-x:auto}
.t-inner{min-width:640px}
.t-head,.t-allday{display:grid;border-bottom:1px solid var(--line)}
.t-head div{padding:8px;text-align:center;font-weight:600;background:#fafbfc}
.t-head div.today{color:var(--accent)}
.t-allday>div{padding:3px;min-height:28px;border-left:1px solid var(--line)}
.t-allday>div:first-child{border-left:none;font-size:11px;color:var(--sub)}
.t-body{display:grid;max-height:560px;overflow-y:auto}
.hours div{height:48px;font-size:11px;color:var(--sub);text-align:right;padding-right:6px;border-top:1px solid var(--line)}
.col{position:relative;border-left:1px solid var(--line);height:1152px;cursor:pointer;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 47px,var(--line) 47px,var(--line) 48px)}
.ev{position:absolute;border-radius:5px;color:#fff;font-size:12px;padding:2px 5px;overflow:hidden;cursor:pointer;border:1px solid #fff}
.empty{padding:6px;color:var(--sub);font-size:12px}
/* 모달 */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal{background:#fff;border-radius:14px;width:420px;max-width:100%;max-height:92vh;overflow:auto;padding:18px}
#modal h2{margin:0 0 12px;font-size:17px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.f input[type=text],.f input[type=date],.f input[type=time],.f select,.f textarea{width:100%}
.f.two{display:flex;gap:8px}.f.two>div{flex:1}
#warn{background:var(--warn);border:1px solid var(--warn-line);border-radius:8px;padding:8px;margin-bottom:10px;display:none;font-size:13px}
#err{color:var(--danger);font-size:13px;margin-bottom:8px;display:none}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btns .left{margin-right:auto}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:60}
/* 백업 */
.backup-btns{display:flex;flex-direction:column;gap:6px}
.backup-btns button{text-align:left}
#backupHint.old{color:var(--danger);font-weight:600}
#impOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:55;padding:12px}
#impBox{background:#fff;border-radius:14px;width:400px;max-width:100%;padding:18px}
#impBox h2{margin:0 0 10px;font-size:17px}
#impBox p{margin:0 0 8px;line-height:1.6}
#impBox .btns{flex-wrap:wrap}
.toast{background:#1f2430;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:300px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;padding:10px}
  .cell{min-height:70px}
  #results{width:260px}
}
</style>
</head>
<body>
<header>
  <h1>📅 내 캘린더</h1>
  <button id="today">오늘</button>
  <button id="prev" aria-label="이전">◀</button>
  <button id="next" aria-label="다음">▶</button>
  <div id="title"></div>
  <div class="seg" id="views">
    <button data-v="month">월</button><button data-v="week">주</button><button data-v="day">일</button>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <input id="q" type="text" placeholder="일정 검색 (제목·메모)" autocomplete="off">
    <div id="results"></div>
  </div>
  <button class="primary" id="addBtn">+ 일정 추가</button>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <h3>카테고리</h3>
      <div id="cats"></div>
      <div class="add-row">
        <input type="text" id="newCat" placeholder="새 카테고리 이름">
        <button id="addCat">추가</button>
      </div>
    </div>
    <div class="card">
      <h3>할 일</h3>
      <div id="todos"></div>
      <div class="add-row">
        <input type="text" id="todoText" placeholder="할 일 입력">
        <input type="date" id="todoDue" title="마감일(선택)">
        <button id="addTodo">추가</button>
      </div>
      <p class="hint">마감일을 정하면 캘린더 월 보기 날짜 칸에도 표시돼요.</p>
    </div>
    <div class="card">
      <h3>알림</h3>
      <button id="perm">브라우저 알림 허용하기</button>
      <p class="hint" id="permHint"></p>
      <p class="hint">이 페이지(탭)가 열려 있을 때만 알림이 울려요. 종일 일정은 오전 9시 기준으로 계산해요.</p>
    </div>
    <div class="card">
      <h3>백업</h3>
      <div class="backup-btns">
        <button id="bkSave">💾 백업 파일 저장</button>
        <button id="bkLoad">📂 백업 불러오기</button>
        <button id="bkIcs">📤 다른 캘린더용 내보내기 (.ics)</button>
      </div>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
      <p class="hint" id="backupHint"></p>
      <p class="hint">일정은 이 브라우저에만 저장돼요. 브라우저 데이터를 지우기 전에 백업 파일을 저장해 두세요. .ics 파일은 구글·애플 캘린더에서 가져올 수 있어요. (할 일은 제외)</p>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="overlay">
  <form id="modal" autocomplete="off">
    <h2 id="mTitle">일정 추가</h2>
    <div class="f"><label>제목 *</label><input type="text" id="fTitle" maxlength="80"></div>
    <div class="f"><label>날짜</label><input type="date" id="fDate"></div>
    <div class="f"><label><input type="checkbox" id="fAll"> 종일</label></div>
    <div class="f two" id="timeRow">
      <div><label>시작</label><input type="time" id="fStart"></div>
      <div><label>종료</label><input type="time" id="fEnd"></div>
    </div>
    <div class="f two">
      <div><label>카테고리</label><select id="fCat"></select></div>
      <div><label>반복</label>
        <select id="fRepeat">
          <option value="none">반복 안 함</option><option value="daily">매일</option>
          <option value="weekly">매주 (같은 요일)</option><option value="monthly">매월 (같은 날짜)</option>
        </select></div>
    </div>
    <div class="f"><label>알림</label><select id="fRemind"></select></div>
    <div class="f"><label>메모</label><textarea id="fMemo" rows="2"></textarea></div>
    <div id="warn"></div>
    <div id="err"></div>
    <div class="btns">
      <button type="button" class="danger left" id="delBtn">삭제</button>
      <button type="button" id="cancelBtn">취소</button>
      <button type="submit" class="primary" id="saveBtn">저장</button>
    </div>
  </form>
</div>
<div id="impOverlay">
  <div id="impBox" role="dialog" aria-modal="true">
    <h2>백업 불러오기</h2>
    <div id="impInfo"></div>
    <div class="btns">
      <button type="button" id="impCancel" class="left">취소</button>
      <button type="button" id="impMerge" class="primary">합치기</button>
      <button type="button" id="impReplace" class="danger">덮어쓰기</button>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
/* ===== 바꿔서 쓸 수 있는 설정 ===== */
const DEFAULT_CATEGORIES = [   // 직장인용 기본 카테고리 (이름·색상을 바꿔 보세요)
  {id:'meeting',  name:'회의',      color:'#4f7cff', on:true},
  {id:'deadline', name:'업무 마감', color:'#e5484d', on:true},
  {id:'personal', name:'개인',      color:'#2fa56b', on:true},
  {id:'etc',      name:'기타',      color:'#8b8f9a', on:true}
];
const REMINDER_OPTIONS = [     // 알림 선택지 (분 단위)
  {v:'',   t:'알림 없음'},
  {v:10,   t:'10분 전'},
  {v:60,   t:'1시간 전'},
  {v:1440, t:'하루 전'}
];
const CHECK_INTERVAL_MS = 30000; // 알림 확인 주기 (30초)
const BACKUP_REMIND_DAYS = 14;   // 마지막 백업 후 이 날짜가 지나면 빨간색으로 알려줌
const BACKUP_APP = 'my-calendar'; // 백업 파일 안에 적는 앱 이름 (다른 파일과 구분용)
const BACKUP_VERSION = 1;         // 백업 파일 형식 버전 (저장 구조가 바뀌면 올림)
const HH = 48;                   // 주/일 보기에서 1시간 높이(px)
const WD = ['일','월','화','수','목','금','토'];

/* ===== 저장/불러오기 ===== */
function load(k, d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function save(){ try{
  localStorage.setItem('cal_events',JSON.stringify(S.events));
  localStorage.setItem('cal_cats',JSON.stringify(S.cats));
  localStorage.setItem('cal_todos',JSON.stringify(S.todos));
  localStorage.setItem('cal_fired',JSON.stringify(S.fired));
}catch(e){ toast('저장 공간을 쓸 수 없어요. 새로고침하면 데이터가 사라질 수 있어요.'); } }

const S = {
  events: load('cal_events',[]),
  cats:   load('cal_cats', DEFAULT_CATEGORIES),
  todos:  load('cal_todos',[]),
  fired:  load('cal_fired',{}),
  view:   load('cal_view','month'),
  cursor: new Date()
};
S.cursor.setHours(0,0,0,0);

/* ===== 날짜 도구 ===== */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const catOf = id => S.cats.find(c=>c.id===id) || S.cats[S.cats.length-1];

/* 이 일정이 해당 날짜에 나타나는가 (반복 규칙 계산) */
function occursOn(ev, ds){
  if(ds < ev.date) return false;
  if(!ev.repeat || ev.repeat==='none') return ds===ev.date;
  if(ev.repeat==='daily') return true;
  const a=parse(ev.date), b=parse(ds);
  if(ev.repeat==='weekly') return a.getDay()===b.getDay();
  if(ev.repeat==='monthly') return a.getDate()===b.getDate();
  return false;
}
function eventsOn(ds, onlyVisible=true){
  return S.events
    .filter(e=>occursOn(e,ds) && (!onlyVisible || catOf(e.cat).on))
    .sort((a,b)=> (b.allDay-a.allDay) || (a.start||'').localeCompare(b.start||''));
}

/* ===== 화면 그리기 ===== */
const $ = id => document.getElementById(id);
function render(){
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.view));
  const c=S.cursor;
  if(S.view==='month'){ $('title').textContent=c.getFullYear()+'년 '+(c.getMonth()+1)+'월'; renderMonth(); }
  else if(S.view==='week'){
    const s=addDays(c,-c.getDay()), e=addDays(s,6);
    $('title').textContent=(s.getMonth()+1)+'/'+s.getDate()+' ~ '+(e.getMonth()+1)+'/'+e.getDate()+' ('+s.getFullYear()+')';
    renderGrid(Array.from({length:7},(_,i)=>addDays(s,i)));
  } else {
    $('title').textContent=c.getFullYear()+'년 '+(c.getMonth()+1)+'월 '+c.getDate()+'일 ('+WD[c.getDay()]+')';
    renderGrid([c]);
  }
  renderSide();
}

function renderMonth(){
  const c=S.cursor, first=new Date(c.getFullYear(),c.getMonth(),1);
  const start=addDays(first,-first.getDay());
  const today=ymd(new Date());
  let h='<div class="m-head">'+WD.map(w=>'<div>'+w+'</div>').join('')+'</div><div class="m-grid">';
  for(let i=0;i<42;i++){
    const d=addDays(start,i), ds=ymd(d);
    const evs=eventsOn(ds);
    const tds=S.todos.filter(t=>t.due===ds);
    const items=[];
    evs.forEach(e=>items.push('<span class="chip" style="background:'+catOf(e.cat).color+'" data-eid="'+e.id+'">'+(e.allDay?'':e.start+' ')+esc(e.title)+'</span>'));
    tds.forEach(t=>items.push('<span class="chip todo'+(t.done?' done':'')+'" data-todo="'+t.id+'">'+(t.done?'☑ ':'☐ ')+esc(t.text)+'</span>'));
    const shown=items.slice(0,3).join('');
    const more=items.length>3?'<div class="more" data-more="'+ds+'">+'+(items.length-3)+'개 더보기</div>':'';
    const cls=['cell']; if(d.getMonth()!==c.getMonth())cls.push('other'); if(ds===today)cls.push('today');
    const wd=d.getDay()===0?'sun':d.getDay()===6?'sat':'';
    h+='<div class="'+cls.join(' ')+'" data-date="'+ds+'"><span class="n '+wd+'">'+d.getDate()+'</span>'+shown+more+'</div>';
  }
  $('main').innerHTML=h+'</div>';
}

/* 겹치는 일정을 옆으로 나란히 배치 */
function layout(evs){
  const list=evs.filter(e=>!e.allDay).map(e=>({e, s:toMin(e.start), en:Math.max(toMin(e.end),toMin(e.start)+20)})).sort((a,b)=>a.s-b.s);
  const out=[]; let cluster=[], clusterEnd=-1;
  const flush=()=>{ cluster.forEach(x=>{x.n=Math.max(...cluster.map(y=>y.col))+1;}); out.push(...cluster); cluster=[]; };
  list.forEach(x=>{
    if(cluster.length && x.s>=clusterEnd) flush();
    const used=cluster.filter(y=>y.en>x.s).map(y=>y.col);
    let col=0; while(used.includes(col)) col++;
    x.col=col; cluster.push(x); clusterEnd=Math.max(clusterEnd,x.en);
  });
  flush();
  return out;
}

function renderGrid(days){
  const n=days.length, today=ymd(new Date());
  const cols='52px repeat('+n+',1fr)';
  let h='<div class="t-wrap"><div class="t-inner">';
  h+='<div class="t-head" style="grid-template-columns:'+cols+'"><div></div>'+days.map(d=>'<div class="'+(ymd(d)===today?'today':'')+'">'+(d.getMonth()+1)+'/'+d.getDate()+' ('+WD[d.getDay()]+')</div>').join('')+'</div>';
  h+='<div class="t-allday" style="grid-template-columns:'+cols+'"><div>종일·할 일</div>'+days.map(d=>{
    const ds=ymd(d);
    const a=eventsOn(ds).filter(e=>e.allDay).map(e=>'<span class="chip" style="background:'+catOf(e.cat).color+'" data-eid="'+e.id+'">'+esc(e.title)+'</span>').join('');
    const t=S.todos.filter(x=>x.due===ds).map(x=>'<span class="chip todo'+(x.done?' done':'')+'" data-todo="'+x.id+'">'+(x.done?'☑ ':'☐ ')+esc(x.text)+'</span>').join('');
    return '<div data-date="'+ds+'">'+a+t+'</div>';
  }).join('')+'</div>';
  h+='<div class="t-body" id="tbody" style="grid-template-columns:'+cols+'"><div class="hours">'+Array.from({length:24},(_,i)=>'<div>'+pad(i)+':00</div>').join('')+'</div>';
  days.forEach(d=>{
    const ds=ymd(d);
    const items=layout(eventsOn(ds)).map(x=>{
      const top=x.s/60*HH, height=Math.max((x.en-x.s)/60*HH-2,18), w=100/x.n;
      return '<div class="ev" data-eid="'+x.e.id+'" style="top:'+top+'px;height:'+height+'px;left:'+(x.col*w)+'%;width:'+w+'%;background:'+catOf(x.e.cat).color+'">'+x.e.start+' '+esc(x.e.title)+'</div>';
    }).join('');
    h+='<div class="col" data-date="'+ds+'" data-col="1">'+items+'</div>';
  });
  h+='</div></div></div>';
  $('main').innerHTML=h;
  const tb=$('tbody'); if(tb) tb.scrollTop=8*HH;
}

function renderSide(){

/* ===== 알림 ===== */
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('toasts').appendChild(t); setTimeout(()=>t.remove(),5000);

function checkReminders(){
  const now=new Date(), days=[ymd(now), ymd(addDays(now,1))];
  let changed=false;
  S.events.forEach(ev=>{
    if(ev.remind==null) return;
    days.forEach(ds=>{
      if(!occursOn(ev,ds)) return;
      const startDt=ev.allDay?new Date(ds+'T09:00:00'):new Date(ds+'T'+ev.start+':00');
      const trigger=new Date(startDt.getTime()-ev.remind*60000);
      const key=ev.id+'|'+ds+'|'+ev.remind;
      if(now>=trigger && now<startDt && !S.fired[key]){
        S.fired[key]=Date.now(); changed=true;
        const label=(REMINDER_OPTIONS.find(o=>o.v===ev.remind)||{}).t||'';
        const text='⏰ '+ev.title+' — '+(ev.allDay?'오늘 종일 일정':ds+' '+ev.start+' 시작')+' ('+label+')';
        toast(text);
        if('Notification' in window && Notification.permission==='granted'){ try{ new Notification(ev.title,{body:ds+' '+(ev.allDay?'종일':ev.start)+' 일정이 곧 시작돼요 ('+label+')'}); }catch(_){} }
      }
    });
  });
  // 7일 지난 알림 기록 정리
  const limit=Date.now()-7*86400000;
  Object.keys(S.fired).forEach(k=>{ if(S.fired[k]<limit){ delete S.fired[k]; changed=true; } });
  if(changed) save();
}

/* 2) 백업 불러오기: 파일 내용을 검사한 뒤 합치기/덮어쓰기 선택 */
const RE_ID=/^[\w-]{1,64}$/, RE_DATE=/^\d{4}-\d{2}-\d{2}$/, RE_TIME=/^\d{2}:\d{2}$/, RE_COLOR=/^#[0-9a-fA-F]{6}$/;
const REPEATS=['none','daily','weekly','monthly'];
const str=(v,max)=>typeof v==='string'?v.slice(0,max):'';
function cleanEvent(e){
  if(!e||!RE_ID.test(e.id)||!RE_DATE.test(e.date)||!str(e.title,80).trim()) return null;
  const allDay=!!e.allDay;
  const start=allDay?'00:00':e.start, end=allDay?'23:59':e.end;
  if(!RE_TIME.test(start)||!RE_TIME.test(end)||toMin(end)<=toMin(start)) return null;
  return {id:e.id, title:str(e.title,80).trim(), date:e.date, allDay, start, end,
    cat:RE_ID.test(e.cat)?e.cat:'etc', repeat:REPEATS.includes(e.repeat)?e.repeat:'none',
    remind:Number.isFinite(e.remind)&&e.remind>=0?e.remind:null, memo:str(e.memo,2000)};
}
function cleanCat(c){
  if(!c||!RE_ID.test(c.id)||!str(c.name,30).trim()) return null;
  return {id:c.id, name:str(c.name,30).trim(), color:RE_COLOR.test(c.color)?c.color:'#8b8f9a', on:c.on!==false};
}
function cleanTodo(t){
  if(!t||!RE_ID.test(t.id)||!str(t.text,200).trim()) return null;
  return {id:t.id, text:str(t.text,200).trim(), due:RE_DATE.test(t.due)?t.due:'', done:!!t.done};
}
const cleanList=(arr,fn)=>Array.isArray(arr)?arr.map(fn).filter(Boolean):[];

let pending=null; // 불러온 뒤 선택을 기다리는 데이터

/* 3) 다른 캘린더용 .ics 내보내기 (구글·애플 캘린더 공통 형식) */
function icsText(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){ // 한 줄이 75바이트를 넘으면 접기 (ics 규칙)
  const enc=new TextEncoder(); const out=[]; let cur='', bytes=0;
  for(const ch of line){
    const b=enc.encode(ch).length;
    if(bytes+b>(out.length?74:75)){ out.push(cur); cur=''; bytes=0; }
    cur+=ch; bytes+=b;
  }
  out.push(cur); return out.join('\r\n ');
}
const icsDate=ds=>ds.replace(/-/g,'');
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function exportICS(){
  if(!S.events.length){ toast('내보낼 일정이 없어요.'); return; }
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//my-calendar//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const now=icsUTC(new Date());
  S.events.forEach(e=>{
    L.push('BEGIN:VEVENT','UID:'+e.id+'@my-calendar','DTSTAMP:'+now,'SUMMARY:'+icsText(e.title));
    if(e.allDay){ L.push('DTSTART;VALUE=DATE:'+icsDate(e.date), 'DTEND;VALUE=DATE:'+icsDate(ymd(addDays(parse(e.date),1)))); }
    else{ L.push('DTSTART:'+icsUTC(new Date(e.date+'T'+e.start+':00')), 'DTEND:'+icsUTC(new Date(e.date+'T'+e.end+':00'))); }
    const freq={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY'}[e.repeat]; if(freq) L.push('RRULE:FREQ='+freq);
    if(e.memo) L.push('DESCRIPTION:'+icsText(e.memo));
    L.push('CATEGORIES:'+icsText(catOf(e.cat).name));
    if(e.remind!=null) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsText(e.title),'TRIGGER:-PT'+e.remind+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  download('캘린더_'+stamp()+'.ics', L.map(icsFold).join('\r\n')+'\r\n', 'text/calendar;charset=utf-8');
  toast('일정 '+S.events.length+'개를 .ics 파일로 내보냈어요.');
}
$('bkIcs').onclick=exportICS;

/* ===== 시작 ===== */
render();
checkReminders();
setInterval(checkReminders, CHECK_INTERVAL_MS);
</script>
</body>
