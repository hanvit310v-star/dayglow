<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my.calendar</title>
<!-- 숫자·영문용 둥근 기하학 글꼴 (인터넷이 없으면 기본 글꼴로 대체돼요) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== 디자인 토큰 — 분위기를 바꾸려면 여기만 고치세요 ===== */
:root{
  --bg:#141917;                    /* 페이지 바탕 (가장 어두운 색) */
  --atmo:#2a3532;                  /* 카드 배경 기본색 */
  --accent:#a3bdb3;                /* 유일한 강조색 (세이지 그린, 레퍼런스 검색 버튼 색) */
  --accent-ink:#17201d;            /* 강조색 위 글자 */
  --t100:rgba(255,255,255,.94);    /* 글자 명도 위계: 주인공 */
  --t70:rgba(255,255,255,.72);     /* 일반 내용 */
  --t50:rgba(255,255,255,.5);      /* 항목명·보조 */
  --t30:rgba(255,255,255,.3);      /* 아주 흐린 정보 */
  --line:rgba(255,255,255,.09);    /* 얇은 구분선 */
  --line2:rgba(255,255,255,.18);   /* 입력창 밑줄 */
  --glass:rgba(24,31,29,.48);      /* 오른쪽 유리 패널 */
  --danger:#e8968f;                /* 삭제·마감 지남 (어두운 배경용 부드러운 빨강) */
  --radius:14px;                   /* 카드·창 모서리. 버튼·입력은 직각(0) */
  --num:'Outfit',system-ui,-apple-system,sans-serif;
  --text:'Outfit',system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--text);font-weight:300;background:var(--bg);color:var(--t70);font-size:14px;letter-spacing:.01em;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(60% 50% at 20% 10%,var(--b1) 0,transparent 70%),radial-gradient(50% 60% at 90% 90%,var(--b2) 0,transparent 70%);
  transition:background-color 1.2s}
button{font:inherit;letter-spacing:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
[hidden]{display:none!important}
::selection{background:rgba(163,189,179,.35)}

/* 입력창: 박스 대신 밑줄 한 줄 */
input,select,textarea{font:inherit;font-weight:300;font-size:15px;color:var(--t100);background:transparent;border:none;border-bottom:1px solid var(--line2);
  border-radius:0;padding:9px 0;max-width:100%;color-scheme:dark}
input::placeholder,textarea::placeholder{color:var(--t30)}
select option{background:#222b28;color:#fff}

/* 버튼: 직각 */
.btn-accent{background:var(--accent);color:var(--accent-ink);padding:10px 18px;font-size:13px;font-weight:400}
.btn-text{color:var(--t50);font-size:13px;padding:8px 4px}
.btn-text:hover{color:var(--t100)}
.btn-danger{color:var(--danger);font-size:13px;padding:8px 4px}
.link{color:var(--accent);font-size:13px}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--t50)}
.icon-btn:hover{color:var(--t100)}

/* ===== 무대와 카드 ===== */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 40px}
.card{position:relative;width:100%;max-width:1320px;min-height:760px;border-radius:var(--radius);overflow:hidden;display:grid;grid-template-columns:62fr 38fr;background:var(--atmo)}
/* 사진처럼 보이는 흐린 대기 배경 (카드 전체에 깔리고 오른쪽 유리 패널 뒤로 은은하게 비침) */
.atmo{position:absolute;inset:-60px;filter:blur(40px);pointer-events:none;
  transition:opacity .9s ease;
  background:
    radial-gradient(30% 32% at 58% 18%,var(--w1) 0,transparent 70%),
    radial-gradient(26% 30% at 72% 62%,var(--w2) 0,transparent 72%),
    radial-gradient(40% 38% at 22% 40%,var(--w3) 0,transparent 70%),
    radial-gradient(35% 40% at 40% 85%,var(--w4) 0,transparent 70%),
    radial-gradient(30% 30% at 88% 30%,var(--w5) 0,transparent 70%),
    radial-gradient(45% 45% at 95% 95%,var(--w6) 0,transparent 70%),
    var(--w0)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
  background-image:radial-gradient(rgba(255,255,255,.5) .6px,transparent .7px),radial-gradient(rgba(0,0,0,.6) .6px,transparent .7px);
  background-size:7px 9px,11px 13px;background-position:0 0,3px 5px}

/* ===== 왼쪽: 달력 영역 ===== */
.left{position:relative;z-index:1;display:flex;flex-direction:column;padding:40px 48px 44px;min-width:0}
.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{font-family:var(--num);font-weight:500;font-size:13px;color:var(--t100);letter-spacing:.02em}
.brand b{color:var(--accent);font-weight:500}
.top .sp{flex:1}
.views{display:flex;gap:18px}
.views button{font-size:13px;color:var(--t50);padding:4px 0;border-bottom:1px solid transparent}
.views button.on{color:var(--t100);border-bottom-color:var(--t100)}
.nav-move{display:flex;align-items:center;gap:6px}
.nav-move .today{font-size:13px;color:var(--t50);padding:4px 6px}
.nav-move .today:hover{color:var(--t100)}
.drop{position:relative}
.drop>.btn-text{padding:4px 0}
#title{margin:34px 0 14px;font-size:12px;letter-spacing:.12em;color:var(--t50)}
main{flex:1;min-height:0;display:flex;flex-direction:column}

/* 월 보기 */
.m-head,.m-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.m-head div{padding:0 8px 10px;font-size:11px;letter-spacing:.14em;color:var(--t30)}
.m-grid{flex:1;grid-auto-rows:minmax(74px,1fr)}
.cell{border-top:1px solid var(--line);padding:8px 8px 6px;cursor:pointer;min-width:0;overflow:hidden;transition:background .15s}
.cell:hover{background:rgba(255,255,255,.03)}
.cell .n{font-family:var(--num);font-size:13px;color:var(--t50);display:inline-block;padding-bottom:2px;margin-bottom:4px}
.cell.other .n{color:var(--t30);opacity:.6}
.cell.today .n{color:var(--t100);font-weight:400;border-bottom:1px solid var(--accent)}
.cell.sel{background:rgba(255,255,255,.06)}
.cell.sel .n{color:var(--t100)}
.chip{display:flex;align-items:center;gap:6px;font-size:11.5px;line-height:1.7;color:var(--t70);white-space:nowrap;overflow:hidden;cursor:pointer}
.chip>.txt{overflow:hidden;text-overflow:ellipsis}
.chip .dot{width:5px;height:5px;border-radius:50%;flex:none}
.chip:hover{color:var(--t100)}
.chip.todo .box{width:10px;height:10px;border-width:1px;font-size:7px}
.chip.todo.done .txt{color:var(--t30);text-decoration:line-through}
.chip.todo.over .txt{color:var(--danger)}
.more{font-size:11px;color:var(--t30);cursor:pointer;margin-top:1px}
.more:hover{color:var(--t100)}

/* 주·일 보기 */
.t-wrap{overflow-x:auto;flex:1;display:flex;flex-direction:column;min-height:0}
.t-inner{min-width:560px;display:flex;flex-direction:column;min-height:0;flex:1}
.t-head,.t-allday{display:grid}
.t-head div{padding:0 6px 12px;font-size:11px;letter-spacing:.12em;color:var(--t30);cursor:pointer}
.t-head div b{display:block;font-family:var(--num);font-size:26px;font-weight:200;letter-spacing:0;color:var(--t70);margin-top:4px}
.t-head div.today b{color:var(--t100);font-weight:300}
.t-head div.sel b{color:var(--accent)}
.t-allday{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.t-allday>div{padding:4px 6px;min-height:28px;min-width:0}
.t-allday>div:first-child{font-size:10px;color:var(--t30);padding-top:9px}
.t-body{display:grid;max-height:430px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.hours div{height:44px;font-family:var(--num);font-size:10px;color:var(--t30);transform:translateY(-6px)}
.hours div:first-child{visibility:hidden}
.col{position:relative;height:1056px;cursor:pointer;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 44px)}
.ev{position:absolute;font-size:11.5px;line-height:1.4;padding:4px 7px;overflow:hidden;cursor:pointer;color:var(--t100);border-left:2px solid;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ev .tm{display:block;font-family:var(--num);font-size:10px;color:var(--t50)}
.now-line{position:absolute;left:0;right:0;height:1px;background:var(--accent);z-index:2;pointer-events:none}

/* 왼쪽 아래 구석: 선택한 날 (레퍼런스의 "08° London") */
.hero{display:flex;align-items:flex-end;gap:22px;margin-top:34px;flex-wrap:wrap}
.hero .big{font-family:var(--num);font-weight:200;font-size:112px;line-height:.82;letter-spacing:-.04em;color:var(--t100)}
.hero .side{padding-bottom:4px}
.hero .place{font-family:var(--text);font-weight:300;font-size:38px;line-height:1;letter-spacing:-.01em;color:var(--t100)}
.hero .meta{font-size:12px;color:var(--t50);margin-top:10px;letter-spacing:.04em}
.hero .stat{padding-bottom:6px;margin-left:8px;text-align:center}
.hero .stat .v{font-family:var(--num);font-weight:200;font-size:30px;color:var(--t100);line-height:1}
.hero .stat .k{font-size:11px;color:var(--t50);margin-top:6px}

/* ===== 오른쪽: 유리 패널 ===== */
.panel{position:relative;z-index:1;background:var(--glass);backdrop-filter:blur(28px) saturate(120%);-webkit-backdrop-filter:blur(28px) saturate(120%);
  padding:0 0 40px 44px;display:flex;flex-direction:column;min-width:0}
.search{position:relative;display:flex;align-items:stretch}
.search input{flex:1;min-width:0;margin:22px 40px 0 0;font-size:13px;padding:12px 0}
.search .sq{width:76px;height:76px;flex:none;background:var(--accent);color:var(--accent-ink);font-size:20px;display:flex;align-items:center;justify-content:center}
#results{position:absolute;left:0;right:76px;top:76px;max-height:320px;overflow:auto;z-index:40;background:rgba(26,33,31,.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);padding:6px 0}
#results div{padding:11px 18px;cursor:pointer;color:var(--t70);font-size:13px}
#results div:hover{background:rgba(255,255,255,.05);color:var(--t100)}
#results small{display:block;color:var(--t30);font-size:11px;margin-top:3px}
.panel .in{padding-right:44px;display:flex;flex-direction:column;flex:1;min-height:0}
.sec{padding:30px 0}
.sec+.sec{border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-head h3{margin:0;font-size:13px;font-weight:400;color:var(--t100);letter-spacing:.01em}
.li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;cursor:pointer;font-size:13px}
.li .nm{display:flex;align-items:center;gap:10px;min-width:0;color:var(--t50);transition:color .15s}
.li .nm span.txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{font-family:var(--num);font-size:12px;color:var(--t70);flex:none}
.li:hover .nm{color:var(--t100)}
.li .dot{width:5px;height:5px;border-radius:50%;flex:none}
.li.done .txt{text-decoration:line-through;color:var(--t30)}
.li.over .txt{color:var(--danger)}
.empty{font-size:13px;color:var(--t30);padding:6px 0}
.kv{display:flex;justify-content:space-between;padding:9px 0;font-size:13px}
.kv span:first-child{color:var(--t50)}
.kv span:last-child{font-family:var(--num);color:var(--t100)}
.kv.warn span:last-child{color:var(--danger)}
.box{width:14px;height:14px;flex:none;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:var(--accent-ink);cursor:pointer}
.box.on{background:var(--accent);border-color:var(--accent)}

/* 마감일 없는 할 일 접이식 줄 */
#todobar .head{width:100%;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t100);text-align:left;padding:0}
#todobar .head .cnt{font-family:var(--num);color:var(--t50)}
#todobar .head .arr{margin-left:auto;color:var(--t30);font-size:11px;transition:transform .2s}
#todobar.open .head .arr{transform:rotate(180deg)}
#todobar .body{margin-top:14px}
#todobar .li .x{color:var(--t30);font-size:11px;padding:2px 4px}
#todobar .li .x:hover{color:var(--danger)}
#todobar .add{display:flex;gap:14px;align-items:center;margin-top:6px}
#todobar .add input{flex:1;font-size:13px}
#banner{margin-top:auto;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--t50);line-height:1.6;display:flex;gap:12px;align-items:flex-start}
#banner span{flex:1}

/* 떠 있는 메뉴 (어두운 유리) */
.pop{position:absolute;right:0;top:calc(100% + 14px);z-index:45;width:300px;background:rgba(26,33,31,.9);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);padding:22px;color:var(--t70);text-align:left}
.pop h4{margin:0 0 12px;font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--t30)}
.pop section+section{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.pop .hint{font-size:12px;color:var(--t50);line-height:1.6;margin:10px 0 0}
.cat-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13px;cursor:pointer}
.cat-row input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);margin:0}
.cat-row input[type=color]{width:16px;height:16px;padding:0;border:none;border-radius:50%;overflow:hidden;cursor:pointer}
.cat-row span{flex:1;color:var(--t70)}
.row{display:flex;gap:14px;align-items:center}
.row input[type=text]{flex:1;min-width:0;font-size:13px}
.stack{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.stack .btn-text{color:var(--t70)}
.kbd{display:inline-block;min-width:18px;text-align:center;border-bottom:1px solid var(--line2);font-family:var(--num);font-size:11px;color:var(--t100);margin-right:6px}
.shortcuts{font-size:12px;line-height:2.2;color:var(--t50)}

/* 입력 창 */
.overlay{position:fixed;inset:0;background:rgba(8,11,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.overlay.show{display:flex}
.sheet{background:rgba(32,40,37,.92);border:1px solid var(--line);border-radius:var(--radius);width:460px;max-width:100%;max-height:92vh;overflow:auto;padding:36px 40px 30px}
.sheet h2{margin:0 0 24px;font-family:var(--text);font-size:26px;font-weight:200;color:var(--t100);letter-spacing:-.01em}
.tabs{display:flex;gap:22px;margin-bottom:22px}
.tabs button{font-size:13px;color:var(--t50);padding:4px 0;border-bottom:1px solid transparent}
.tabs button.on{color:var(--t100);border-bottom-color:var(--t100)}
.f{margin-bottom:18px}
.f label:not(.check){display:block;font-size:11px;letter-spacing:.1em;color:var(--t30);margin-bottom:2px}
.f input[type=text],.f input[type=date],.f input[type=time],.f select,.f textarea{width:100%}
.f.two{display:flex;gap:22px}.f.two>div{flex:1;min-width:0}
.check{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;color:var(--t70)}
.check input{width:14px;height:14px;accent-color:var(--accent);margin:0}
.note{padding:12px 0;margin-bottom:10px;font-size:12px;line-height:1.6;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#warn{color:#e9cf9a}
#err{color:var(--danger);border:none;padding:0}
#permAsk{display:flex;align-items:center;gap:12px;color:var(--t50)}
#permAsk span{flex:1}
.btns{display:flex;gap:18px;justify-content:flex-end;align-items:center;margin-top:26px}
.btns .left{margin-right:auto}

/* 알림 토스트 */
#toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:70}
.toast{background:rgba(26,33,31,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);color:var(--t100);padding:12px 20px;font-size:13px;max-width:90vw}

/* =====================================================================
   날씨 테마 — 내 위치의 날씨에 따라 아래 색 묶음 중 하나가 적용돼요.
   w0~w6: 카드 배경의 흐린 덩어리 색 / b1·b2: 페이지 바탕의 은은한 빛
   색을 바꾸고 싶으면 해당 날씨 블록의 값만 고치세요.
   ===================================================================== */
:root,body[data-wx=rain]{   /* 비: 차분한 청록 (기본값) */
  --w0:#34423e;--w1:#121816;--w2:#18201e;--w3:#5d726c;--w4:#46574f;--w5:#3d4c47;--w6:#2b3734;
  --b1:#24302c;--b2:#1f2a27;--bg:#141917;--atmo:#2a3532;--accent:#a3bdb3;--accent-ink:#17201d;--glass:rgba(24,31,29,.48)}
body[data-wx=clear]{        /* 맑음: 따뜻한 샴페인·모래빛 */
  --w0:#5a4c3d;--w1:#2a241d;--w2:#3a3128;--w3:#a08b6c;--w4:#7d6a52;--w5:#c2a47a;--w6:#3d342a;
  --b1:#2e271e;--b2:#251f18;--bg:#17140f;--atmo:#3f362c;--accent:#dcc39a;--accent-ink:#231c12;--glass:rgba(36,30,23,.45)}
body[data-wx=night]{        /* 맑은 밤: 깊은 남색 */
  --w0:#1e2645;--w1:#0c1020;--w2:#121831;--w3:#3a4a78;--w4:#26315a;--w5:#4a5a8c;--w6:#1a2040;
  --b1:#182040;--b2:#121830;--bg:#0b0e18;--atmo:#1a2140;--accent:#aebbe6;--accent-ink:#11162a;--glass:rgba(14,18,34,.5)}
body[data-wx=cloudy]{       /* 흐림: 슬레이트 회색 */
  --w0:#424a4f;--w1:#1c1f21;--w2:#25292c;--w3:#6e777c;--w4:#535b60;--w5:#7d868b;--w6:#2f3438;
  --b1:#262b2e;--b2:#1e2225;--bg:#151719;--atmo:#353b3f;--accent:#c3cbd0;--accent-ink:#1b1f22;--glass:rgba(28,32,35,.48)}
body[data-wx=snow]{        /* 눈: 차가운 얼음빛 청회색 */
  --w0:#55626e;--w1:#2f3a45;--w2:#3e4a56;--w3:#93a5b4;--w4:#738595;--w5:#b4c4d1;--w6:#4a5763;
  --b1:#2c3640;--b2:#222a32;--bg:#161b20;--atmo:#44505b;--accent:#e2ecf4;--accent-ink:#1c2530;--glass:rgba(26,34,42,.6)}
body[data-wx=fog]{         /* 안개: 회백색 그레이지 */
  --w0:#5e5c56;--w1:#2c2b28;--w2:#3a3935;--w3:#8c8981;--w4:#77746c;--w5:#a29e94;--w6:#4a4843;
  --b1:#2a2926;--b2:#21201e;--bg:#171715;--atmo:#4b4945;--accent:#d8d1c3;--accent-ink:#22201b;--glass:rgba(40,39,36,.45)}
body[data-wx=storm]{       /* 뇌우: 짙은 남보라 */
  --w0:#23263a;--w1:#0b0c12;--w2:#11131c;--w3:#3e4459;--w4:#2c3144;--w5:#4c4566;--w6:#1a1c28;
  --b1:#1a1c2a;--b2:#141520;--bg:#0b0c10;--atmo:#1d2030;--accent:#bcb0e0;--accent-ink:#18152a;--glass:rgba(16,17,26,.52)}
.card{transition:background-color 1.2s}

/* 날씨 효과 (아주 은은하게) */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.fx .drop{position:absolute;top:-90px;width:1px;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.28));animation:wxFall linear infinite}
@keyframes wxFall{from{transform:translate(0,0) rotate(var(--tilt,8deg))}to{transform:translate(var(--drift,-150px),1150px) rotate(var(--tilt,8deg))}}
.fx .flake{position:absolute;top:-20px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(.6px);animation:wxSnow linear infinite}
@keyframes wxSnow{0%{transform:translate(0,0)}25%{transform:translate(18px,280px)}50%{transform:translate(-6px,560px)}75%{transform:translate(16px,840px)}100%{transform:translate(0,1120px)}}
.fx .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:wxTwinkle ease-in-out infinite}
@keyframes wxTwinkle{0%,100%{opacity:.12}50%{opacity:.7}}
.fx .sun{position:absolute;top:-35%;right:-15%;width:80%;height:90%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,221,170,.32),rgba(255,200,140,.1) 55%,transparent);filter:blur(30px);animation:wxBreathe 10s ease-in-out infinite}
@keyframes wxBreathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.fx .haze{position:absolute;left:-50%;width:200%;height:70%;filter:blur(40px);animation:wxDrift ease-in-out infinite alternate}
@keyframes wxDrift{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.fx .flash{position:absolute;inset:0;background:#dcd6ff;opacity:0;animation:wxFlash 11s infinite}
@keyframes wxFlash{0%,90%,92.5%,95%,100%{opacity:0}91%{opacity:.09}94%{opacity:.05}}
@media (prefers-reduced-motion:reduce){.fx *{animation:none!important}.fx .drop,.fx .flake{display:none}}

/* =====================================================================
   상황 변화 — 시간대(새벽·노을·밤) · 기온(폭염·한파) · 바람 · 바쁜 날 · 일정 진행 중
   ===================================================================== */
.fx{opacity:var(--fx-op,1);transition:opacity .6s}
.tod,.tmp{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:0;transition:opacity 1.6s ease}
body[data-tod=dawn] .tod{opacity:1;background:radial-gradient(70% 45% at 30% 108%,rgba(255,172,150,.24),transparent 70%),radial-gradient(50% 35% at 82% 102%,rgba(255,208,165,.14),transparent 70%)}
body[data-tod=dusk] .tod{opacity:1;background:radial-gradient(75% 50% at 15% 108%,rgba(255,142,82,.26),transparent 70%),radial-gradient(60% 45% at 72% 104%,rgba(172,92,165,.2),transparent 70%)}
body[data-tod=night]:not([data-wx=night]) .tod{opacity:1;background:linear-gradient(180deg,rgba(4,7,18,.34),rgba(4,7,18,.2))}
body[data-temp=heat] .tmp{opacity:1;background:radial-gradient(85% 60% at 50% 112%,rgba(255,118,66,.22),transparent 72%)}
body[data-temp=cold] .tmp{opacity:1;background:radial-gradient(120% 115% at 50% 45%,transparent 55%,rgba(226,240,255,.17) 100%)}
body[data-wind=strong] .fx{--tilt:22deg;--drift:-430px}
body[data-focus="1"] .fx *{animation-play-state:paused}
.hero .now{margin-top:8px;font-size:12px;color:var(--accent);letter-spacing:.02em}
.hero .now::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px;animation:wxTwinkle 2.4s ease-in-out infinite}

/* 왼쪽 아래 날씨 표시 = 분위기 패널을 여는 버튼 */
.hero .wxs{cursor:pointer;padding:6px 10px 6px;margin-left:0;border-bottom:1px solid transparent;transition:border-color .2s}
.hero .wxs:hover,.hero .wxs[aria-expanded=true]{border-bottom-color:var(--line2)}
.hero .wxs .v{font-size:30px}
.hero .wxs .k{white-space:nowrap}
.hero .wxs .k i{font-style:normal;color:var(--t30);margin-left:5px;font-size:10px}

/* 분위기 패널 (날씨·상황 직접 고르기) */
.pop.mood{left:48px;right:auto;top:auto;width:380px;padding:24px 24px 18px}
.mood-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.mood-head h4{margin:0}
.mrow{display:grid;grid-template-columns:64px 1fr;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow .ml{font-size:11px;letter-spacing:.1em;color:var(--t30)}
.chips{display:flex;flex-wrap:wrap;gap:4px 14px}
.chips button{font-size:13px;color:var(--t50);padding:2px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.chips button:hover{color:var(--t100)}
.chips button.on{color:var(--t100);border-bottom-color:var(--accent)}
.chips button small{color:var(--t30);font-size:11px;margin-left:3px}
.mrow input[type=range]{width:100%;accent-color:var(--accent);border:none;padding:0;height:18px}
.range{display:flex;align-items:center;gap:12px}
.range output{font-family:var(--num);font-size:12px;color:var(--t70);min-width:34px;text-align:right}
.tog{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tog span{flex:1;font-size:13px;color:var(--t70)}
.tog small{display:block;font-size:11px;color:var(--t30);margin-top:3px}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog i{width:30px;height:16px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.tog i::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--t70);transition:transform .2s,background .2s}
.tog input:checked+i{background:var(--accent)}
.tog input:checked+i::after{transform:translateX(14px);background:var(--accent-ink)}
.tog input:focus-visible+i{outline:1px solid var(--accent);outline-offset:3px}
.mood .hint{margin-top:12px}
.left{z-index:2}   /* 달력 쪽 메뉴·분위기 패널이 오른쪽 패널에 가려지지 않게 */
/* 메뉴·패널·입력 창·알림 바탕도 현재 날씨 테마 색을 따라감 */
.pop,#results,.toast{background:color-mix(in srgb,var(--bg) 90%,transparent);transition:background-color 1.2s}
.sheet{background:color-mix(in srgb,color-mix(in srgb,var(--atmo) 45%,var(--bg)) 95%,transparent)}
select option{background:var(--bg)}

/* ===== 반응형 ===== */
@media (max-width:1080px){
  .stage{padding:24px 16px}
  .card{grid-template-columns:1fr;min-height:0}
  .panel{padding:0 0 32px 32px}
  .panel .in{padding-right:32px}
  .left{padding:32px 32px 36px}
  .hero .big{font-size:92px}
}
@media (max-width:640px){
  .stage{padding:0}
  .card{border-radius:0}
  .left{padding:24px 18px 28px}
  .panel{padding:0 0 28px 18px}.panel .in{padding-right:18px}
  .top{gap:14px}
  .brand{flex:1 1 100%}
  .m-grid{grid-auto-rows:minmax(56px,1fr)}
  .cell{padding:6px 4px}
  .chip .txt{display:none}
  .hero .big{font-size:72px}.hero .place{font-size:28px}
  .search .sq{width:60px;height:60px}.search input{margin-top:14px}#results{top:60px;right:60px}
  .pop{position:fixed;left:16px;right:16px;top:90px;width:auto}
  .pop.mood{top:auto;bottom:16px!important;left:16px;right:16px;width:auto;max-height:80vh;overflow:auto}
}
</style>
</head>
<body>
<div class="stage">
<div class="card">
  <div class="atmo"></div><div class="grain"></div><div class="tod"></div><div class="tmp"></div><div class="fx" id="fx"></div>

  <!-- 왼쪽: 달력 -->
  <section class="left">
    <div class="top">
      <span class="brand">my<b>.</b>calendar</span>
      <div class="views" id="views"><button data-v="month">월</button><button data-v="week">주</button><button data-v="day">일</button></div>
      <span class="sp"></span>
      <div class="nav-move">
        <button class="icon-btn" id="prev" aria-label="이전">‹</button>
        <button class="today" id="today">오늘</button>
        <button class="icon-btn" id="next" aria-label="다음">›</button>
      </div>
      <div class="drop">
        <button class="btn-text" id="catBtn">카테고리</button>
        <div class="pop" id="catPop" hidden>
          <h4>보여 줄 카테고리</h4>
          <div id="cats"></div>
          <div class="row" style="margin-top:12px">
            <input type="text" id="newCat" placeholder="새 카테고리 이름" maxlength="30">
            <button class="link" id="addCat">추가</button>
          </div>
        </div>
      </div>
      <div class="drop">
        <button class="icon-btn" id="setBtn" aria-label="설정" title="설정">⚙︎</button>
        <div class="pop" id="setPop" hidden>
          <section>
            <h4>알림</h4>
            <p class="hint" id="permHint" style="margin-top:0"></p>
            <button class="link" id="perm" style="margin-top:8px">브라우저 알림 허용하기</button>
            <p class="hint">이 페이지가 열려 있을 때만 알림이 울려요. 종일 일정은 오전 9시 기준이에요.</p>
          </section>
          <section>
            <h4>분위기 (날씨·상황)</h4>
            <p class="hint" id="wxHint" style="margin-top:0"></p>
            <div class="row" style="margin-top:8px;gap:18px">
              <button class="link" id="openMood">분위기 직접 고르기</button>
              <button class="link" id="wxRefresh">날씨 다시 확인</button>
            </div>
            <p class="hint">위치는 날씨를 확인할 때만 쓰고 저장하지 않아요. 약 1km 단위로 뭉갠 좌표만 날씨 서비스(Open-Meteo)로 보내요.</p>
          </section>
          <section>
            <h4>백업</h4>
            <div class="stack">
              <button class="btn-text" id="bkSave">백업 파일 저장</button>
              <button class="btn-text" id="bkLoad">백업 불러오기</button>
              <button class="btn-text" id="bkIcs">다른 캘린더용 내보내기 (.ics)</button>
            </div>
            <p class="hint" id="backupHint"></p>
          </section>
          <section>
            <h4>단축키</h4>
            <div class="shortcuts">
              <span class="kbd">N</span>새로 추가 &nbsp; <span class="kbd">T</span>오늘<br>
              <span class="kbd">M</span>월 <span class="kbd">W</span>주 <span class="kbd">D</span>일 &nbsp; <span class="kbd">←</span><span class="kbd">→</span>이동
            </div>
          </section>
        </div>
      </div>
      <button class="btn-accent" id="addBtn">+ 추가</button>
    </div>
    <div id="title"></div>
    <main id="main"></main>
    <div class="hero" id="hero"></div>

    <!-- 분위기 패널: 날씨·상황을 직접 고르기 (왼쪽 아래 날씨를 누르면 열림) -->
    <div class="pop mood" id="moodPop" hidden role="dialog" aria-label="분위기 설정">
      <div class="mood-head"><h4>분위기</h4><button class="link" id="moodReset">모두 자동으로</button></div>
      <div class="mrow"><span class="ml">날씨</span><div class="chips" data-k="weather"></div></div>
      <div class="mrow"><span class="ml">시간대</span><div class="chips" data-k="tod"></div></div>
      <div class="mrow"><span class="ml">기온</span><div class="chips" data-k="temp"></div></div>
      <div class="mrow"><span class="ml">효과</span><div class="range"><input type="range" id="moodInt" min="0" max="100" step="10" aria-label="효과 세기"><output id="moodIntV"></output></div></div>
      <label class="tog"><span>바쁜 날엔 차분하게<small>오늘 일정 5개 이상이거나 빈 시간이 3시간 미만이면 효과를 줄여요</small></span><input type="checkbox" id="moodBusy"><i></i></label>
      <label class="tog"><span>일정 중엔 효과 멈춤<small>진행 중인 일정을 왼쪽 아래에 표시해요</small></span><input type="checkbox" id="moodFocus"><i></i></label>
      <p class="hint" id="moodNow"></p>
    </div>
  </section>

  <!-- 오른쪽: 유리 패널 -->
  <aside class="panel">
    <div class="search">
      <input id="q" type="text" placeholder="일정 검색" autocomplete="off" aria-label="일정 검색">
      <button class="sq" id="qBtn" aria-label="검색">⌕</button>
      <div id="results" hidden></div>
    </div>
    <div class="in">
      <div class="sec" id="agenda"></div>
      <div class="sec" id="summary"></div>
      <div class="sec" id="todobar" hidden></div>
      <div id="banner" hidden>
        <span id="bannerText"></span>
        <button class="link" id="bannerGo">지금 백업</button>
        <button class="btn-text" id="bannerX" aria-label="닫기" style="padding:0">✕</button>
      </div>
    </div>
  </aside>
</div>
</div>
<input type="file" id="bkFile" accept=".json,application/json" hidden>

<!-- 일정·할 일 입력 창 -->
<div class="overlay" id="overlay">
  <form class="sheet" id="modal" autocomplete="off">
    <h2 id="mTitle">새로 추가</h2>
    <div class="tabs" id="mTabs">
      <button type="button" data-tab="event">일정</button><button type="button" data-tab="todo">할 일</button>
    </div>
    <div id="evFields">
      <div class="f"><label for="fTitle">제목</label><input type="text" id="fTitle" maxlength="80" placeholder="예: 팀 회의"></div>
      <div class="f two">
        <div><label for="fDate">날짜</label><input type="date" id="fDate"></div>
        <div style="display:flex;align-items:flex-end;padding-bottom:10px"><label class="check"><input type="checkbox" id="fAll"> 종일</label></div>
      </div>
      <div class="f two" id="timeRow">
        <div><label for="fStart">시작</label><input type="time" id="fStart"></div>
        <div><label for="fEnd">종료</label><input type="time" id="fEnd"></div>
      </div>
      <div class="f two">
        <div><label for="fCat">카테고리</label><select id="fCat"></select></div>
        <div><label for="fRepeat">반복</label>
          <select id="fRepeat">
            <option value="none">반복 안 함</option><option value="daily">매일</option>
            <option value="weekly">매주 (같은 요일)</option><option value="monthly">매월 (같은 날짜)</option>
          </select></div>
      </div>
      <div class="f" id="newCatRow" hidden><label for="fNewCat">새 카테고리 이름</label><input type="text" id="fNewCat" maxlength="30"></div>
      <div class="f"><label for="fRemind">알림</label><select id="fRemind"></select></div>
      <div class="note" id="permAsk" hidden><span>알림을 받으려면 브라우저 알림을 허용해야 해요.</span><button type="button" class="link" id="permAskBtn">허용하기</button></div>
      <div class="f"><label for="fMemo">메모</label><textarea id="fMemo" rows="2"></textarea></div>
      <div class="note" id="warn" hidden></div>
    </div>
    <div id="todoFields" hidden>
      <div class="f"><label for="fTodoText">할 일</label><input type="text" id="fTodoText" maxlength="200" placeholder="예: 보고서 초안 쓰기"></div>
      <div class="f"><label for="fTodoDue">마감일 · 비워 두면 '마감일 없는 할 일'에 들어가요</label><input type="date" id="fTodoDue"></div>
      <div class="f" id="todoDoneRow"><label class="check"><input type="checkbox" id="fTodoDone"> 완료</label></div>
    </div>
    <div class="note" id="err" hidden></div>
    <div class="btns">
      <button type="button" class="btn-danger left" id="delBtn">삭제</button>
      <button type="button" class="btn-text" id="cancelBtn">취소</button>
      <button type="submit" class="btn-accent" id="saveBtn">저장</button>
    </div>
  </form>
</div>

<!-- 백업 불러오기 선택 창 -->
<div class="overlay" id="impOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <h2>백업 불러오기</h2>
    <div id="impInfo" style="font-size:13px;line-height:1.7"></div>
    <div class="btns">
      <button type="button" class="btn-text left" id="impCancel">취소</button>
      <button type="button" class="btn-danger" id="impReplace">덮어쓰기</button>
      <button type="button" class="btn-accent" id="impMerge">합치기</button>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
/* ===== 바꿔서 쓸 수 있는 설정 ===== */
const DEFAULT_CATEGORIES = [   // 기본 카테고리 (어두운 배경에 맞춘 차분한 색)
  {id:'meeting',  name:'회의',      color:'#8fb3d9', on:true},
  {id:'deadline', name:'업무 마감', color:'#e09b8f', on:true},
  {id:'personal', name:'개인',      color:'#a3c9a8', on:true},
  {id:'etc',      name:'기타',      color:'#a7aaa8', on:true}
];
const NEW_CAT_COLORS = ['#c3a6d6','#e3c08d','#93c8cf','#d9a3b8','#d8d39a','#a9a8dc'];
const REMINDER_OPTIONS = [
  {v:'',   t:'알림 없음'},
  {v:10,   t:'10분 전'},
  {v:60,   t:'1시간 전'},
  {v:1440, t:'하루 전'}
];
const ACTIVE_HOURS = [9, 22];     // '비어 있는 시간'을 계산할 활동 시간 (9시~22시)
const CHECK_INTERVAL_MS = 30000;  // 알림 확인 주기 (30초)
const HH = 44;                    // 주/일 보기에서 1시간 높이(px)
const WD = ['일','월','화','수','목','금','토'];
const MONTH_KO = m => (m+1)+'월';
const BACKUP_REMIND_DAYS = 14;
const BACKUP_APP = 'my-calendar';
const BACKUP_VERSION = 1;
const SHORTCUTS = {KeyN:'new', KeyT:'today', KeyM:'month', KeyW:'week', KeyD:'day', ArrowLeft:'prev', ArrowRight:'next'};

/* ===== 저장/불러오기 ===== */
function load(k, d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
function save(){ try{
  localStorage.setItem('cal_events',JSON.stringify(S.events));
  localStorage.setItem('cal_cats',JSON.stringify(S.cats));
  localStorage.setItem('cal_todos',JSON.stringify(S.todos));
  localStorage.setItem('cal_fired',JSON.stringify(S.fired));
}catch(e){ toast('저장 공간을 쓸 수 없어요. 새로고침하면 데이터가 사라질 수 있어요.'); } }

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const S = {
  events: load('cal_events',[]),
  cats:   load('cal_cats', DEFAULT_CATEGORIES),
  todos:  load('cal_todos',[]),
  fired:  load('cal_fired',{}),
  view:   load('cal_view','month'),
  todoOpen: load('cal_todoBarOpen', false),
  cursor: new Date(),
  sel: ymd(new Date())            // 선택한 날짜 (오른쪽 패널·왼쪽 아래 큰 숫자)
};
S.cursor.setHours(0,0,0,0);

/* ===== 날짜 도구 ===== */
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const toMin = t => { const [h,m]=t.split(':').map(Number); return h*60+m; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const catOf = id => S.cats.find(c=>c.id===id) || S.cats[S.cats.length-1];
const catById = id => S.cats.find(c=>c.id===id);
const md = ds => Number(ds.slice(5,7))+'/'+Number(ds.slice(8));
const todayStr = () => ymd(new Date());

function occursOn(ev, ds){
  if(ds < ev.date) return false;
  if(!ev.repeat || ev.repeat==='none') return ds===ev.date;
  if(ev.repeat==='daily') return true;
  const a=parse(ev.date), b=parse(ds);
  if(ev.repeat==='weekly') return a.getDay()===b.getDay();
  if(ev.repeat==='monthly') return a.getDate()===b.getDate();
  return false;
}
function eventsOn(ds, onlyVisible=true){
  return S.events
    .filter(e=>occursOn(e,ds) && (!onlyVisible || catOf(e.cat).on))
    .sort((a,b)=> (b.allDay-a.allDay) || (a.start||'').localeCompare(b.start||''));
}
/* 이 날짜에 보여 줄 할 일: 그날 마감 + (오늘이면) 밀린 할 일을 맨 위에 */
function todosOn(ds){
  const today=todayStr();
  const list=S.todos.filter(t=>t.due===ds).map(t=>({t,over:!t.done && t.due<today}));
  if(ds===today) S.todos.filter(t=>t.due && t.due<today && !t.done).reverse().forEach(t=>list.unshift({t,over:true}));
  return list;
}
/* 활동 시간 안에서 일정이 없는 시간(분) */
function freeMinutes(ds){
  const [a,b]=[ACTIVE_HOURS[0]*60, ACTIVE_HOURS[1]*60];
  const iv=eventsOn(ds).filter(e=>!e.allDay).map(e=>[Math.max(a,toMin(e.start)),Math.min(b,toMin(e.end))]).filter(x=>x[1]>x[0]).sort((x,y)=>x[0]-y[0]);
  let used=0, cs=-1, ce=-1;
  iv.forEach(([s,e])=>{ if(s>ce){ if(ce>cs) used+=ce-cs; cs=s; ce=e; } else ce=Math.max(ce,e); });
  if(ce>cs) used+=ce-cs;
  return b-a-used;
}
const hm = m => (m>=60?Math.floor(m/60)+'h ':'')+(m%60?m%60+'m':(m>=60?'':'0m'));

/* ===== 화면 그리기 ===== */
const $ = id => document.getElementById(id);
function render(){
  if(S.view==='day') S.sel=ymd(S.cursor);
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on', b.dataset.v===S.view));
  const c=S.cursor;
  if(S.view==='month'){ $('title').textContent=c.getFullYear()+' · '+MONTH_KO(c.getMonth()); renderMonth(); }
  else if(S.view==='week'){
    const s=addDays(c,-c.getDay()), e=addDays(s,6);
    $('title').textContent=s.getFullYear()+' · '+md(ymd(s))+' – '+md(ymd(e));
    renderGrid(Array.from({length:7},(_,i)=>addDays(s,i)));
  } else {
    $('title').textContent=c.getFullYear()+' · '+MONTH_KO(c.getMonth())+' '+c.getDate()+'일 '+WD[c.getDay()]+'요일';
    renderGrid([c]);
  }
  renderHero(); renderAgenda(); renderSummary(); renderTodoBar(); renderCats(); renderSettings(); renderBanner();
  applyContext();   // 일정이 바뀌면 '바쁜 날'·'일정 중' 상황도 다시 계산
}

function eventChip(e){
  return '<span class="chip" data-eid="'+e.id+'"><i class="dot" style="background:'+catOf(e.cat).color+'"></i><span class="txt">'+esc(e.title)+'</span></span>';
}
function todoChip(x){
  const t=x.t;
  return '<span class="chip todo'+(t.done?' done':'')+(x.over?' over':'')+'" data-todo="'+t.id+'" title="'+(x.over?'마감 '+md(t.due)+' 지남':'할 일')+'">'+
    '<span class="box'+(t.done?' on':'')+'" data-tchk="'+t.id+'">'+(t.done?'✓':'')+'</span><span class="txt">'+esc(t.text)+'</span></span>';
}

function renderMonth(){
  const c=S.cursor, first=new Date(c.getFullYear(),c.getMonth(),1);
  const start=addDays(first,-first.getDay());
  const today=todayStr(), maxShown=2;        // 정보 밀도: 칸마다 2개까지만
  const weeks=Math.ceil((first.getDay()+new Date(c.getFullYear(),c.getMonth()+1,0).getDate())/7);
  let h='<div class="m-head">'+WD.map(w=>'<div>'+w+'</div>').join('')+'</div><div class="m-grid">';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i), ds=ymd(d);
    const tds=todosOn(ds), late=ds===today?tds.filter(x=>x.over):[], rest=tds.filter(x=>!late.includes(x));
    const items=[...late.map(todoChip), ...eventsOn(ds).map(eventChip), ...rest.map(todoChip)];
    const more=items.length>maxShown?'<div class="more" data-more="'+ds+'">+'+(items.length-maxShown)+'</div>':'';
    const cls=['cell']; if(d.getMonth()!==c.getMonth())cls.push('other'); if(ds===today)cls.push('today'); if(ds===S.sel)cls.push('sel');
    h+='<div class="'+cls.join(' ')+'" data-date="'+ds+'"><span class="n">'+pad(d.getDate())+'</span>'+items.slice(0,maxShown).join('')+more+'</div>';
  }
  $('main').innerHTML=h+'</div>';
}

function layout(evs){
  const list=evs.filter(e=>!e.allDay).map(e=>({e, s:toMin(e.start), en:Math.max(toMin(e.end),toMin(e.start)+20)})).sort((a,b)=>a.s-b.s);
  const out=[]; let cluster=[], clusterEnd=-1;
  const flush=()=>{ cluster.forEach(x=>{x.n=Math.max(...cluster.map(y=>y.col))+1;}); out.push(...cluster); cluster=[]; };
  list.forEach(x=>{
    if(cluster.length && x.s>=clusterEnd) flush();
    const used=cluster.filter(y=>y.en>x.s).map(y=>y.col);
    let col=0; while(used.includes(col)) col++;
    x.col=col; cluster.push(x); clusterEnd=Math.max(clusterEnd,x.en);
  });
  flush();
  return out;
}

function renderGrid(days){
  const n=days.length, now=new Date(), today=ymd(now);
  const cols='44px repeat('+n+',1fr)';
  let h='<div class="t-wrap"><div class="t-inner">';
  h+='<div class="t-head" style="grid-template-columns:'+cols+'"><div></div>'+days.map(d=>{ const ds=ymd(d);
    return '<div data-sel="'+ds+'" class="'+(ds===today?'today ':'')+(ds===S.sel?'sel':'')+'">'+WD[d.getDay()]+'<b>'+pad(d.getDate())+'</b></div>'; }).join('')+'</div>';
  h+='<div class="t-allday" style="grid-template-columns:'+cols+'"><div>종일</div>'+days.map(d=>{
    const ds=ymd(d);
    return '<div data-date="'+ds+'">'+eventsOn(ds).filter(e=>e.allDay).map(eventChip).join('')+todosOn(ds).map(todoChip).join('')+'</div>';
  }).join('')+'</div>';
  h+='<div class="t-body" id="tbody" style="grid-template-columns:'+cols+'"><div class="hours">'+Array.from({length:24},(_,i)=>'<div>'+pad(i)+':00</div>').join('')+'</div>';
  days.forEach(d=>{
    const ds=ymd(d);
    let items=layout(eventsOn(ds)).map(x=>{
      const col=catOf(x.e.cat).color;
      const top=x.s/60*HH, height=Math.max((x.en-x.s)/60*HH-2,20), w=100/x.n;
      return '<div class="ev" data-eid="'+x.e.id+'" style="top:'+top+'px;height:'+height+'px;left:calc('+(x.col*w)+'% + 2px);width:calc('+w+'% - 4px);background:'+col+'26;border-left-color:'+col+'">'+
        '<span class="tm">'+x.e.start+'</span>'+esc(x.e.title)+'</div>';
    }).join('');
    if(ds===today) items+='<div class="now-line" style="top:'+((now.getHours()*60+now.getMinutes())/60*HH)+'px"></div>';
    h+='<div class="col" data-date="'+ds+'" data-col="1">'+items+'</div>';
  });
  h+='</div></div></div>';
  $('main').innerHTML=h;
  const tb=$('tbody'); if(tb) tb.scrollTop=Math.max(0,(days.some(d=>ymd(d)===today)?now.getHours()-2:8))*HH;
}

/* 왼쪽 아래: 선택한 날을 크게 (주인공 하나만 크게, 나머지는 작게) */
function renderHero(){
  const d=parse(S.sel), n=eventsOn(S.sel).length, today=todayStr(), nowEv=mood.focus?nowEvent():null;
  const rel=S.sel===today?'오늘':S.sel===ymd(addDays(new Date(),1))?'내일':S.sel===ymd(addDays(new Date(),-1))?'어제':'';
  $('hero').innerHTML='<div class="big">'+pad(d.getDate())+'</div>'+
    '<div class="side"><div class="place">'+WD[d.getDay()]+'요일</div><div class="meta">'+(rel?rel+' · ':'')+d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'</div>'+
      (S.sel===today && nowEv ? '<div class="now">지금 · '+esc(nowEv.title)+' ~'+nowEv.end+'</div>' : '')+'</div>'+
    '<div class="stat"><div class="v">'+n+'</div><div class="k">일정</div></div>'+
    '<button class="stat wxs" id="moodBtn" aria-haspopup="dialog" aria-expanded="'+!$('moodPop').hidden+'" title="분위기 직접 고르기">'+
      '<div class="v">'+(wx?wx.temp+'°':'·')+'</div><div class="k">'+moodLabel()+'<i>▴</i></div></button>';
}

/* 오른쪽 패널 1: 선택한 날의 목록 */
function renderAgenda(){
  const ds=S.sel, today=todayStr(), d=parse(ds);
  const label=ds===today?'오늘의 일정':md(ds)+' '+WD[d.getDay()]+'요일';
  const evs=eventsOn(ds), tds=todosOn(ds);
  let h='<div class="sec-head"><h3>'+label+'</h3><button class="link" data-addsel>+ 추가</button></div>';
  if(!evs.length && !tds.length) h+='<div class="empty">비어 있는 하루예요.</div>';
  h+=evs.map(e=>'<div class="li" data-eid="'+e.id+'"><span class="nm"><i class="dot" style="background:'+catOf(e.cat).color+'"></i><span class="txt">'+esc(e.title)+'</span></span><span class="v">'+(e.allDay?'종일':e.start)+'</span></div>').join('');
  h+=tds.map(x=>'<div class="li'+(x.t.done?' done':'')+(x.over?' over':'')+'" data-todo="'+x.t.id+'"><span class="nm"><span class="box'+(x.t.done?' on':'')+'" data-tchk="'+x.t.id+'">'+(x.t.done?'✓':'')+'</span><span class="txt">'+esc(x.t.text)+'</span></span><span class="v">'+(x.over?md(x.t.due)+' 마감':'할 일')+'</span></div>').join('');
  $('agenda').innerHTML=h;
}

/* 오른쪽 패널 2: 하루 요약 (항목명은 흐리게 왼쪽, 수치는 선명하게 오른쪽) */
function renderSummary(){
  const ds=S.sel, today=todayStr();
  const evs=eventsOn(ds), tds=S.todos.filter(t=>t.due===ds);
  const overdue=S.todos.filter(t=>t.due && t.due<today && !t.done).length;
  const rows=[
    ['일정', evs.length+''],
    ['할 일 (완료/전체)', tds.filter(t=>t.done).length+' / '+tds.length],
    ['비어 있는 시간 ('+ACTIVE_HOURS[0]+'–'+ACTIVE_HOURS[1]+'시)', hm(freeMinutes(ds))],
    ['밀린 할 일', overdue+'', overdue>0]
  ];
  $('summary').innerHTML='<div class="sec-head"><h3>하루 요약</h3></div>'+rows.map(r=>'<div class="kv'+(r[2]?' warn':'')+'"><span>'+r[0]+'</span><span>'+r[1]+'</span></div>').join('');
}

/* 오른쪽 패널 3: 마감일 없는 할 일 (접이식) */
function renderTodoBar(){
  const bar=$('todobar'), list=S.todos.filter(t=>!t.due);
  if(!list.length){ bar.hidden=true; return; }
  bar.hidden=false; bar.classList.toggle('open', S.todoOpen);
  const open=list.filter(t=>!t.done), done=list.filter(t=>t.done);
  let h='<button class="head" id="todoHead" aria-expanded="'+S.todoOpen+'">마감일 없는 할 일 <span class="cnt">'+(open.length?pad(open.length):'모두 완료')+'</span><span class="arr">▾</span></button>';
  if(S.todoOpen){
    h+='<div class="body">'+[...open,...done].map(t=>
      '<div class="li'+(t.done?' done':'')+'"><span class="nm"><span class="box'+(t.done?' on':'')+'" data-tchk="'+t.id+'">'+(t.done?'✓':'')+'</span><span class="txt" data-todo="'+t.id+'">'+esc(t.text)+'</span></span><button class="x" data-tdel="'+t.id+'" aria-label="삭제">✕</button></div>').join('')+
      '<div class="add"><input type="text" id="barTodo" placeholder="할 일 추가 후 Enter" maxlength="200"><button class="link" id="barTodoAdd">추가</button>'+
      (done.length?'<button class="btn-text" id="clearDone">완료 지우기</button>':'')+'</div></div>';
  }
  bar.innerHTML=h;
}

function renderCats(){
  $('cats').innerHTML=S.cats.map(c=>
    '<label class="cat-row"><input type="checkbox" data-cat-on="'+c.id+'" '+(c.on?'checked':'')+'>'+
    '<input type="color" data-cat-color="'+c.id+'" value="'+c.color+'" aria-label="'+esc(c.name)+' 색"><span>'+esc(c.name)+'</span></label>').join('');
  const off=S.cats.filter(c=>!c.on).length;
  $('catBtn').textContent='카테고리'+(off?' '+(S.cats.length-off)+'/'+S.cats.length:'');
}

function permState(){ return ('Notification' in window)?Notification.permission:'unsupported'; }
const daysSince = ts => Math.floor((Date.now()-ts)/86400000);
function renderSettings(){
  const p=permState();
  $('permHint').textContent=p==='granted'?'알림이 켜져 있어요.':p==='denied'?'브라우저 설정에서 이 사이트의 알림을 허용해야 해요. (그동안은 화면 안 알림만 떠요)':p==='unsupported'?'이 브라우저는 알림을 지원하지 않아요.':'아직 허용 전이에요.';
  $('perm').hidden=p!=='default';
  const last=load('cal_lastBackup',null);
  $('backupHint').textContent=last?'마지막 백업: '+(daysSince(last)===0?'오늘':daysSince(last)+'일 전'):'아직 백업한 적이 없어요.';
}
let bannerClosed=false;
function renderBanner(){
  const last=load('cal_lastBackup',null), hasData=S.events.length+S.todos.length>0;
  const need=hasData && (!last || daysSince(last)>=BACKUP_REMIND_DAYS);
  $('banner').hidden=!need || bannerClosed;
  if(need) $('bannerText').textContent=(last?'마지막 백업이 '+daysSince(last)+'일 전이에요.':'아직 백업한 적이 없어요.')+' 브라우저 데이터를 지우면 일정이 사라질 수 있어요.';
}
$('bannerX').onclick=()=>{ bannerClosed=true; renderBanner(); };
$('bannerGo').onclick=()=>exportJSON(false);

/* ===== 클릭 처리 ===== */
function toggleTodo(id){ const t=S.todos.find(x=>x.id===id); if(t){ t.done=!t.done; save(); render(); } }
function select(ds){ S.sel=ds; render(); }
$('main').addEventListener('click',e=>{
  const chk=e.target.closest('[data-tchk]'); if(chk){ toggleTodo(chk.dataset.tchk); return; }
  const td=e.target.closest('[data-todo]'); if(td){ openTodo(td.dataset.todo); return; }
  const chip=e.target.closest('[data-eid]'); if(chip){ openEvent(chip.dataset.eid); return; }
  const more=e.target.closest('[data-more]'); if(more){ S.cursor=parse(more.dataset.more); setView('day'); return; }
  const hd=e.target.closest('[data-sel]'); if(hd){ select(hd.dataset.sel); return; }
  const cell=e.target.closest('.cell'); if(cell){ select(cell.dataset.date); return; }   // 월 보기: 한 번 누르면 선택
  const slot=e.target.closest('[data-date]');
  if(slot){
    let time=null;
    if(slot.dataset.col){ const r=slot.getBoundingClientRect(); const hr=Math.min(23,Math.max(0,Math.floor((e.clientY-r.top)/HH))); time=pad(hr)+':00'; }
    S.sel=slot.dataset.date; openNew('event', slot.dataset.date, time, true);
  }
});
$('main').addEventListener('dblclick',e=>{ const cell=e.target.closest('.cell'); if(cell && !e.target.closest('.chip,.more')) openNew('event', cell.dataset.date, null, true); });  // 월 보기: 두 번 누르면 추가
$('agenda').addEventListener('click',e=>{
  if(e.target.closest('[data-addsel]')){ openNew('event', S.sel, null, true); return; }
  const chk=e.target.closest('[data-tchk]'); if(chk){ toggleTodo(chk.dataset.tchk); return; }
  const td=e.target.closest('[data-todo]'); if(td){ openTodo(td.dataset.todo); return; }
  const ev=e.target.closest('[data-eid]'); if(ev) openEvent(ev.dataset.eid);
});
$('todobar').addEventListener('click',e=>{
  if(e.target.closest('#todoHead')){ S.todoOpen=!S.todoOpen; store('cal_todoBarOpen',S.todoOpen); renderTodoBar(); return; }
  const chk=e.target.closest('[data-tchk]'); if(chk){ toggleTodo(chk.dataset.tchk); return; }
  const del=e.target.closest('[data-tdel]');
  if(del){ S.todos=S.todos.filter(t=>t.id!==del.dataset.tdel); save(); render(); toast('할 일을 삭제했어요.'); return; }
  const td=e.target.closest('[data-todo]'); if(td){ openTodo(td.dataset.todo); return; }
  if(e.target.id==='barTodoAdd') addBarTodo();
  if(e.target.id==='clearDone'){ const n=S.todos.filter(t=>!t.due&&t.done).length; S.todos=S.todos.filter(t=>t.due||!t.done); save(); render(); toast('완료한 할 일 '+n+'개를 지웠어요.'); }
});
$('todobar').addEventListener('keydown',e=>{ if(e.target.id==='barTodo' && e.key==='Enter' && !e.isComposing){ e.preventDefault(); addBarTodo(); } });
function addBarTodo(){
  const v=$('barTodo').value.trim(); if(!v) return;
  S.todos.push({id:uid(), text:v, due:'', done:false}); save(); render(); $('barTodo').focus();
}

function setView(v){ S.view=v; store('cal_view',v); if(v!=='month') S.cursor=parse(S.sel); render(); }
$('views').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.v); });
function move(dir){
  const c=S.cursor;
  if(S.view==='month') S.cursor=new Date(c.getFullYear(),c.getMonth()+dir,1);
  else S.cursor=addDays(c,dir*(S.view==='week'?7:1));
  render();
}
function goToday(){ S.cursor=new Date(); S.cursor.setHours(0,0,0,0); S.sel=todayStr(); render(); }
$('prev').onclick=()=>move(-1); $('next').onclick=()=>move(1); $('today').onclick=goToday;
$('addBtn').onclick=()=>openNew('event', S.sel, null);

}
$('addCat').onclick=()=>{ const name=$('newCat').value.trim(); if(!name) return; addCategory(name); $('newCat').value=''; save(); render(); };
$('newCat').addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); $('addCat').click(); } });

/* ===== 검색 ===== */
function runSearch(){
  const q=$('q').value.trim().toLowerCase(), box=$('results');
  if(!q){ box.hidden=true; return; }
  const hits=S.events.filter(e=>(e.title+' '+(e.memo||'')).toLowerCase().includes(q)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,20);
  box.innerHTML=hits.length?hits.map(e=>'<div data-id="'+e.id+'">'+esc(e.title)+'<small>'+e.date+(e.allDay?' 종일':' '+e.start+'–'+e.end)+(e.repeat&&e.repeat!=='none'?' · 반복':'')+'</small></div>').join(''):'<div style="cursor:default;color:var(--t30)">검색 결과가 없어요.</div>';
  box.hidden=false;
}
$('q').addEventListener('input',runSearch);
$('qBtn').onclick=()=>{ $('q').focus(); runSearch(); };
$('results').addEventListener('click',e=>{
  const r=e.target.closest('[data-id]'); if(!r) return;
  const ev=S.events.find(x=>x.id===r.dataset.id);
  S.cursor=parse(ev.date); S.sel=ev.date; render(); $('results').hidden=true; $('q').value=''; openEvent(ev.id);

function checkReminders(){
  const now=new Date(), days=[ymd(now), ymd(addDays(now,1))];
  let changed=false;
  S.events.forEach(ev=>{
    if(ev.remind==null) return;
    days.forEach(ds=>{
      if(!occursOn(ev,ds)) return;
      const startDt=ev.allDay?new Date(ds+'T09:00:00'):new Date(ds+'T'+ev.start+':00');
      const trigger=new Date(startDt.getTime()-ev.remind*60000);
      const key=ev.id+'|'+ds+'|'+ev.remind;
      if(now>=trigger && now<startDt && !S.fired[key]){
        S.fired[key]=Date.now(); changed=true;
        const label=(REMINDER_OPTIONS.find(o=>o.v===ev.remind)||{}).t||'';
        toast('⏰ '+ev.title+' — '+(ev.allDay?'오늘 종일 일정':ds+' '+ev.start+' 시작')+' ('+label+')');
        if(permState()==='granted'){ try{ new Notification(ev.title,{body:ds+' '+(ev.allDay?'종일':ev.start)+' 일정이 곧 시작돼요 ('+label+')'}); }catch(_){} }
      }
    });
  });
  const limit=Date.now()-7*86400000;
  Object.keys(S.fired).forEach(k=>{ if(S.fired[k]<limit){ delete S.fired[k]; changed=true; } });
  if(changed) save();
}

const RE_ID=/^[\w-]{1,64}$/, RE_DATE=/^\d{4}-\d{2}-\d{2}$/, RE_TIME=/^\d{2}:\d{2}$/, RE_COLOR=/^#[0-9a-fA-F]{6}$/;

function cleanEvent(e){
  if(!e||!RE_ID.test(e.id)||!RE_DATE.test(e.date)||!str(e.title,80).trim()) return null;

    cat:RE_ID.test(e.cat)?e.cat:'etc', repeat:REPEATS.includes(e.repeat)?e.repeat:'none',
    remind:Number.isFinite(e.remind)&&e.remind>=0?e.remind:null, memo:str(e.memo,2000)};
}

function icsText(s){ return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const enc=new TextEncoder(); const out=[]; let cur='', bytes=0;
  for(const ch of line){
    const b=enc.encode(ch).length;
    if(bytes+b>(out.length?74:75)){ out.push(cur); cur=''; bytes=0; }
    cur+=ch; bytes+=b;
  }
  out.push(cur); return out.join('\r\n ');
}
const icsDate=ds=>ds.replace(/-/g,'');
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function exportICS(){
  if(!S.events.length){ toast('내보낼 일정이 없어요.'); return; }
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//my-calendar//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const now=icsUTC(new Date());
  S.events.forEach(e=>{
    L.push('BEGIN:VEVENT','UID:'+e.id+'@my-calendar','DTSTAMP:'+now,'SUMMARY:'+icsText(e.title));
    if(e.allDay){ L.push('DTSTART;VALUE=DATE:'+icsDate(e.date), 'DTEND;VALUE=DATE:'+icsDate(ymd(addDays(parse(e.date),1)))); }
    else{ L.push('DTSTART:'+icsUTC(new Date(e.date+'T'+e.start+':00')), 'DTEND:'+icsUTC(new Date(e.date+'T'+e.end+':00'))); }
    const freq={daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY'}[e.repeat]; if(freq) L.push('RRULE:FREQ='+freq);
    if(e.memo) L.push('DESCRIPTION:'+icsText(e.memo));
    L.push('CATEGORIES:'+icsText(catOf(e.cat).name));
    if(e.remind!=null) L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsText(e.title),'TRIGGER:-PT'+e.remind+'M','END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  download('캘린더_'+stamp()+'.ics', L.map(icsFold).join('\r\n')+'\r\n', 'text/calendar;charset=utf-8');
  toast('일정 '+S.events.length+'개를 .ics 파일로 내보냈어요.');
}

/* ===== 날씨에 따라 바뀌는 배경 =====
   브라우저 위치 → Open-Meteo(무료, API 키 없음)에서 현재 날씨 → 테마 적용 */
const WEATHER_REFRESH_MIN = 30;   // 날씨를 다시 확인하는 간격(분)
const WX_LABEL = {clear:'맑음', night:'맑은 밤', cloudy:'흐림', rain:'비', snow:'눈', fog:'안개', storm:'뇌우'};
let wx = load('cal_weather', null);          // {theme, temp, at} — 좌표는 저장하지 않음
let wxMode = load('cal_weatherMode', 'auto');
let wxStatus = '';
const curTheme = () => wxMode!=='auto' ? wxMode : (wx ? wx.theme : 'rain');

/* 세계기상기구(WMO) 날씨 코드 → 테마 */
function themeOf(code, isDay){
  if([95,96,99].includes(code)) return 'storm';
  if([71,73,75,77,85,86].includes(code)) return 'snow';
  if((code>=51&&code<=67)||[80,81,82].includes(code)) return 'rain';
  if([45,48].includes(code)) return 'fog';
  if([2,3].includes(code)) return 'cloudy';
  return isDay ? 'clear' : 'night';
}

/* 날씨 효과 만들기 (빗줄기·눈송이·별·햇빛·안개) */
function buildFx(theme){
  const fx=$('fx'), r=(a,b)=>a+Math.random()*(b-a); let h='';
  if(theme==='rain'||theme==='storm'){
    const n=theme==='storm'?90:65;
    for(let i=0;i<n;i++) h+='<i class="drop" style="left:'+r(0,112)+'%;height:'+r(40,90)+'px;opacity:'+r(.25,.9)+';animation-duration:'+r(.7,1.3)+'s;animation-delay:-'+r(0,2)+'s"></i>';
    if(theme==='storm') h+='<i class="flash"></i>';
  }
  if(theme==='snow') for(let i=0;i<55;i++){ const s=r(2,5); h+='<i class="flake" style="left:'+r(0,100)+'%;width:'+s+'px;height:'+s+'px;opacity:'+r(.35,.9)+';animation-duration:'+r(12,24)+'s;animation-delay:-'+r(0,24)+'s"></i>'; }
  if(theme==='night') for(let i=0;i<55;i++) h+='<i class="star" style="left:'+r(0,100)+'%;top:'+r(0,70)+'%;animation-duration:'+r(3,7)+'s;animation-delay:-'+r(0,7)+'s"></i>';
  if(theme==='clear') h+='<i class="sun"></i>';
  if(theme==='fog') h+='<i class="haze" style="top:10%;background:radial-gradient(40% 50% at 30% 50%,rgba(255,255,255,.14),transparent),radial-gradient(35% 45% at 75% 40%,rgba(255,255,255,.1),transparent);animation-duration:26s"></i>'+
                      '<i class="haze" style="top:45%;background:radial-gradient(45% 50% at 60% 50%,rgba(255,255,255,.12),transparent);animation-duration:34s;animation-delay:-12s"></i>';
  if(theme==='cloudy') h+='<i class="haze" style="top:-10%;background:radial-gradient(30% 40% at 25% 50%,rgba(0,0,0,.22),transparent),radial-gradient(28% 36% at 70% 45%,rgba(255,255,255,.06),transparent);animation-duration:40s"></i>';
  fx.innerHTML=h;
}

/* 테마 바꾸기: 배경을 살짝 흐렸다가 새 색으로 */
function applyTheme(theme){
  const body=document.body, atmo=document.querySelector('.atmo');
  if(body.dataset.wx===theme) return;
  if(!body.dataset.wx){ body.dataset.wx=theme; buildFx(theme); return; }   // 처음 열 때는 바로
  atmo.style.opacity=0; $('fx').style.opacity=0;
  setTimeout(()=>{ body.dataset.wx=theme; buildFx(theme); atmo.style.opacity=1; $('fx').style.opacity=''; },500);  // ''로 되돌려야 '효과 세기'가 적용됨
}
function renderWx(){
  let t='';
  if(wx){ const m=Math.round((Date.now()-wx.at)/60000); t='내 위치: '+WX_LABEL[wx.theme]+' '+wx.temp+'° · '+(m?m+'분 전 확인':'방금 확인'); }
  if(wxMode!=='auto') t+=(t?' · ':'')+'날씨는 직접 고른 '+WX_LABEL[wxMode]+' 테마를 쓰는 중';
  $('wxHint').textContent=[t,wxStatus].filter(Boolean).join(' ');
  renderHero(); renderMood();
}
function wxFallback(){ applyTheme(curTheme()); renderWx(); }
let wxBusy=false;
function refreshWeather(force){
  applyTheme(curTheme());                                   // 직접 고른 날씨가 있으면 바로 적용
  if(!force && wx && Date.now()-wx.at < WEATHER_REFRESH_MIN*60000){ renderWx(); applyContext(); return; }
  if(wxBusy) return;
  if(!('geolocation' in navigator)){ wxStatus='이 브라우저는 위치 기능을 지원하지 않아 기본 테마를 써요.'; return wxFallback(); }
  wxBusy=true; wxStatus='위치를 확인하는 중…'; renderWx();
  // 위치 허락 창에 응답하지 않으면 15초 뒤 안내 문구를 바꿈 (그동안 기본 테마 유지)
  const waitTimer=setTimeout(()=>{ if(wxBusy){ wxStatus='위치 허락을 기다리는 중이에요. 그동안 기본 테마를 써요.'; renderWx(); } },15000);
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude.toFixed(2), lon=pos.coords.longitude.toFixed(2);   // 약 1km 단위로 뭉갬
    try{
      const res=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
        '&current=temperature_2m,weather_code,is_day,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1');
      if(!res.ok) throw new Error(res.status);
      const j=await res.json(), c=j.current;
      wx={theme:themeOf(c.weather_code, c.is_day), temp:Math.round(c.temperature_2m), wind:Math.round(c.wind_speed_10m),
          sunrise:j.daily&&j.daily.sunrise[0], sunset:j.daily&&j.daily.sunset[0], at:Date.now()};
      store('cal_weather', wx); wxStatus='';
    }catch(_){ wxStatus='날씨를 가져오지 못했어요. 인터넷 연결을 확인해 주세요.'; }
    clearTimeout(waitTimer); wxBusy=false; wxFallback();
  }, err=>{
    clearTimeout(waitTimer); wxBusy=false;
    wxStatus=err.code===1?'위치 권한이 꺼져 있어 기본 테마를 써요. (주소창 왼쪽 자물쇠에서 위치를 허용할 수 있어요)'
            :'위치를 확인하지 못했어요. (맥: 시스템 설정 → 개인정보 보호 및 보안 → 위치 서비스에서 브라우저를 켜 주세요)';
    wxFallback();
  }, {timeout:10000, maximumAge:WEATHER_REFRESH_MIN*60000});
}
$('wxRefresh').onclick=()=>refreshWeather(true);

/* ===== 상황 변화 (날씨 외) =====
   기본은 모두 '자동'. 분위기 패널에서 직접 고르면 그 값을 우선 사용 */
const HEAT_C = 33, COLD_C = -10;          // 폭염·한파 기준 기온(°C)
const WIND_STRONG_KMH = 40;               // 강풍 기준 (km/h)
const BUSY_EVENTS = 5, BUSY_FREE_MIN = 180; // 바쁜 날 기준: 일정 5개 이상 또는 빈 시간 3시간 미만
const TOD_LABEL = {dawn:'새벽', day:'낮', dusk:'노을', night:'밤'};
const TEMP_LABEL = {normal:'보통', heat:'폭염', cold:'한파'};
const MOOD_DEFAULT = {tod:'auto', temp:'auto', intensity:100, busyCalm:true, focus:true};
let mood = Object.assign({}, MOOD_DEFAULT, load('cal_mood', {}));
const saveMood = () => store('cal_mood', mood);

/* 해 뜨고 지는 시각으로 시간대 판단 (날씨 정보가 없으면 06:30 / 18:00 기준) */
function autoTod(){
  const now=new Date(), M=60000; let sr, ss;
  if(wx && wx.sunrise && wx.sunrise.slice(0,10)===todayStr()){ sr=new Date(wx.sunrise); ss=new Date(wx.sunset); }
  else { sr=new Date(); sr.setHours(6,30,0,0); ss=new Date(); ss.setHours(18,0,0,0); }
  if(now>=sr-45*M && now<+sr+45*M) return 'dawn';
  if(now>=ss-60*M && now<+ss+30*M) return 'dusk';
  return (now>=sr && now<ss) ? 'day' : 'night';
}
const autoTemp = () => !wx ? null : wx.temp>=HEAT_C ? 'heat' : wx.temp<=COLD_C ? 'cold' : 'normal';
const curTod = () => mood.tod!=='auto' ? mood.tod : autoTod();
const curTemp = () => mood.temp!=='auto' ? mood.temp : (autoTemp()||'normal');
function nowEvent(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  return eventsOn(todayStr()).find(e=>!e.allDay && toMin(e.start)<=m && m<toMin(e.end)) || null;
}
const isBusy = () => { const ds=todayStr(); return eventsOn(ds).filter(e=>!e.allDay).length>=BUSY_EVENTS || freeMinutes(ds)<BUSY_FREE_MIN; };
function moodLabel(){
  const parts=[WX_LABEL[curTheme()]], tod=curTod(), tmp=curTemp();
  if(tod==='dawn'||tod==='dusk'||(tod==='night'&&curTheme()!=='night')) parts.push(TOD_LABEL[tod]);
  if(tmp!=='normal') parts.push(TEMP_LABEL[tmp]);
  return parts.join(' · ');
}

/* 지금 상황을 화면에 반영 */
function applyContext(){
  const b=document.body, busy=mood.busyCalm && isBusy(), ev=mood.focus ? nowEvent() : null;
  b.dataset.tod=curTod(); b.dataset.temp=curTemp();
  b.dataset.wind=(wxMode==='auto' && wx && wx.wind>=WIND_STRONG_KMH) ? 'strong' : '';
  b.dataset.busy=busy?'1':''; b.dataset.focus=ev?'1':'';
  $('fx').style.setProperty('--fx-op', (mood.intensity/100)*(busy?0.4:1));
  if(!$('moodPop').hidden) renderMood();
}

/* 분위기 패널 그리기 */
function renderMood(){
  const auto={weather:wx?WX_LABEL[wx.theme]:'', tod:TOD_LABEL[autoTod()], temp:autoTemp()?TEMP_LABEL[autoTemp()]:''};
  const opts={weather:WX_LABEL, tod:TOD_LABEL, temp:TEMP_LABEL};
  const cur={weather:wxMode, tod:mood.tod, temp:mood.temp};
  document.querySelectorAll('#moodPop .chips').forEach(box=>{
    const k=box.dataset.k;
    box.innerHTML='<button data-v="auto" class="'+(cur[k]==='auto'?'on':'')+'">자동'+(auto[k]?'<small>'+auto[k]+'</small>':'')+'</button>'+
      Object.entries(opts[k]).map(([v,l])=>'<button data-v="'+v+'" class="'+(cur[k]===v?'on':'')+'">'+l+'</button>').join('');
  });
  $('moodInt').value=mood.intensity; $('moodIntV').textContent=mood.intensity===0?'끔':mood.intensity+'%';
  $('moodBusy').checked=mood.busyCalm; $('moodFocus').checked=mood.focus;
  const ev=mood.focus?nowEvent():null, busy=mood.busyCalm&&isBusy();
  $('moodNow').textContent='지금 적용 중: '+moodLabel()+(wx?' · '+wx.temp+'°':'')+(document.body.dataset.wind?' · 강풍':'')+
    (busy?' · 바쁜 날이라 효과를 줄였어요':'')+(ev?' · 일정 진행 중이라 효과를 멈췄어요':'');
}
function openMood(){
  togglePop('moodPop');
  if(!$('moodPop').hidden){
    const left=document.querySelector('.left').getBoundingClientRect(), hero=$('hero').getBoundingClientRect();
    if(window.innerWidth>640) $('moodPop').style.bottom=(left.bottom-hero.top+14)+'px';
    renderMood();
  }
}
$('hero').addEventListener('click',e=>{ if(e.target.closest('#moodBtn')){ e.stopPropagation(); openMood(); } });
$('openMood').onclick=e=>{ e.stopPropagation(); togglePop(null); openMood(); };
$('moodPop').addEventListener('click',e=>{
  const b=e.target.closest('.chips button'); if(!b) return;
  const k=b.closest('.chips').dataset.k, v=b.dataset.v;
  if(k==='weather'){ wxMode=v; store('cal_weatherMode', wxMode); wxStatus=''; refreshWeather(false); }
  else { mood[k]=v; saveMood(); }
  applyContext(); renderHero(); renderMood();
});
$('moodInt').oninput=()=>{ mood.intensity=Number($('moodInt').value); saveMood(); applyContext(); renderMood(); };
$('moodBusy').onchange=()=>{ mood.busyCalm=$('moodBusy').checked; saveMood(); applyContext(); renderMood(); };
$('moodFocus').onchange=()=>{ mood.focus=$('moodFocus').checked; saveMood(); applyContext(); renderHero(); renderMood(); };
$('moodReset').onclick=()=>{
  mood=Object.assign({}, MOOD_DEFAULT); saveMood();
  wxMode='auto'; store('cal_weatherMode','auto'); wxStatus='';
  refreshWeather(false); applyContext(); renderHero(); renderMood(); toast('분위기를 모두 자동으로 되돌렸어요.');
};

/* ===== 시작 ===== */
applyTheme(curTheme());
render();
renderWx();
refreshWeather(false);
setInterval(()=>refreshWeather(false), WEATHER_REFRESH_MIN*60000);
setInterval(()=>{ applyContext(); renderHero(); }, 60000);   // 시간대·일정 진행 중 여부를 1분마다 다시 확인
/* 노트북을 다시 열거나 탭으로 돌아오면 날씨·상황을 바로 다시 확인 */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ refreshWeather(false); applyContext(); renderHero(); } });
checkReminders();
setInterval(checkReminders, CHECK_INTERVAL_MS);
let lastDay=todayStr();
setInterval(()=>{ const d=todayStr(); if(d!==lastDay){ if(S.sel===lastDay) S.sel=d; lastDay=d; render(); } }, 60000);
</script>
