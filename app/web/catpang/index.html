<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고양이 궁디팡팡</title>
  <style>
    :root { --bg: #0B1020; --ink: #EAF0FF; --dim: #A9B6D9; --amber: #FFB86B; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 24px 16px; text-align: center;
      background: radial-gradient(ellipse at 50% 30%, #1B2547 0%, #0B1020 70%); }
    h1 { margin: 0; font-size: 28px; font-weight: 400; }
    p { margin: 0; color: var(--dim); font-size: 16px; line-height: 1.6; }
    #cat { position: relative; width: min(60vw, 300px); aspect-ratio: 347 / 431; border: 0; padding: 0;
      background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    #cat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      pointer-events: none; user-select: none; -webkit-user-drag: none; }
    #turn { opacity: 0; }
    #cat.turned #turn { opacity: 1; }
    #cat.turned #back { opacity: 0; }
    #cat.pat { animation: pat 0.18s ease-out; }
    @keyframes pat { 0% { transform: scale(1); } 40% { transform: scale(0.94, 1.04); } 100% { transform: scale(1); } }
    #count { font-size: 20px; color: var(--amber); min-height: 1.5em; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
    a.btn { display: inline-block; padding: 10px 18px; border: 1px solid rgba(234,240,255,.3);
      color: var(--ink); text-decoration: none; font-size: 16px; }
    a.btn:hover, a.btn:focus-visible { border-color: var(--amber); color: var(--amber); }
    small { color: var(--dim); font-size: 13px; max-width: 34em; line-height: 1.6; }
    @media (prefers-reduced-motion: reduce) { #cat.pat { animation: none; } }
  </style>
</head>
<body>
  <h1>고양이 궁디팡팡</h1>
  <p>고양이를 클릭하거나 터치해서 팡팡 두드려 보세요.</p>
  <button id="cat" type="button" aria-label="고양이 엉덩이 팡팡">
    <img id="back" src="cat_back.png" alt="">
    <img id="turn" src="cat_turn.png" alt="">
  </button>
  <div id="count" aria-live="polite">0팡</div>
  <div class="links">
    <a class="btn" href="CatPang.zip" download>맥 앱 받기 (Apple 실리콘 · macOS 14 이상)</a>
    <a class="btn" href="/">Dayglow 캘린더 보기</a>
  </div>
  <small>맥 앱은 처음 열 때 보안 경고가 뜰 수 있어요. 압축을 풀고 앱을 <b>오른쪽 클릭 → 열기</b>로 실행해 주세요.</small>

  <script>
    (function () {
      var cat = document.getElementById('cat');
      var count = document.getElementById('count');
      var sound = new Audio('cat_turn_sound.m4a');
      var n = 0, timer = null;
      cat.addEventListener('click', function () {
        n += 1;
        count.textContent = n + '팡';
        cat.classList.remove('pat'); void cat.offsetWidth; cat.classList.add('pat');
        if (n % 5 === 0) {                 // 5번 팡팡할 때마다 고양이가 뒤돌아봐요
          cat.classList.add('turned');
          try { sound.currentTime = 0; sound.play(); } catch (e) {}
          clearTimeout(timer);
          timer = setTimeout(function () { cat.classList.remove('turned'); }, 1600);
        }
      });
    })();
  </script>
</body>
</html>
